name: Windows NSIS
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 tests and NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p usv-core --all-targets -- -D warnings
      - run: cargo test --locked -p usv-core
      - run: npm test
      - run: npm exec playwright -- install chromium
      - run: npm run test:ui
      - name: Dependency notices
        run: python tools/third-party.py
      - run: npm run tauri -- build --bundles nsis
      - name: WebView2 runtime prerequisite
        run: ./tools/ensure-webview2.ps1
      - name: Native WebView2 IPC smoke
        run: node tools/native-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/usv-groundstation.exe
            licenses/*
            .impeccable/review/windows-native.png
            playwright-report/
