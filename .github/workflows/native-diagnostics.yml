name: Windows native diagnostics
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Windows build run with windows-x64 artifact
        required: true
        default: '41243922742'

permissions:
  contents: read
  actions: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
          path: .reference/native-artifact
      - name: WebView2 environment and policies
        run: |
          node -e "console.log(JSON.stringify(Object.fromEntries(Object.entries(process.env).filter(([k])=>/^WEBVIEW2/i.test(k)))))"
          foreach ($scope in @('HKLM:', 'HKCU:')) {
            foreach ($key in @('Software\Policies\Microsoft\Edge\WebView2', 'Software\WOW6432Node\Policies\Microsoft\Edge\WebView2')) {
              $path = "$scope\$key"
              if (Test-Path -LiteralPath $path) {
                Get-ItemProperty -LiteralPath $path
                Get-ChildItem -LiteralPath $path -Recurse | ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath }
              }
            }
          }
      - name: WebView2 runtime prerequisite
        run: ./tools/ensure-webview2.ps1
      - name: Native WebView2 IPC smoke
        env:
          USV_NATIVE_DIAGNOSTICS: '1'
        run: node tools/native-smoke.mjs .reference/native-artifact/target/release/usv-groundstation.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-diagnostics
          path: .impeccable/review/windows-native.png
